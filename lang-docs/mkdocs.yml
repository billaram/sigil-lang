site_name: Sigil Language
site_description: A neuro-symbolic programming language
site_url: https://sigil-lang.org
repo_url: https://github.com/billaram/sigil-lang
repo_name: sigil-lang

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/index.md
    - Editor Setup: getting-started/editor-setup.md
  - Language Tour:
    - tour/index.md
  - Guides:
    - Sigil for Python Developers: guides/sigil-for-python-devs.md
    - Philosophy: guides/philosophy.md
  - Reference:
    - Syntax: reference/syntax.md
    - Type System: reference/types.md
    - CLI: reference/cli.md
  - Cookbook:
    - Overview: cookbook/index.md
    - Hello World: cookbook/hello-world.md
    - Temperature Monitor: cookbook/temperature-monitor.md
    - Loan Eligibility: cookbook/loan-eligibility.md
    - Medical Triage: cookbook/medical-triage.md
    - Compliance Checker: cookbook/compliance-checker.md

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/billaram/sigil-lang
